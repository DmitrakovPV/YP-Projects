openapi: 3.0.3
info:
  title: Users and Houses Service API
  version: 1.1.0
  description: |
    Аутентификация, профили пользователей и управление домами.
servers:
  - url: https://api.warmhouse.local/v1
    description: Через API Gateway
x-service-prefix: /users-houses
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Users
  - name: Houses
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Аутентификация
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Обновление токена
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }

  /users/me:
    get:
      tags: [Users]
      summary: Профиль текущего пользователя
      description: Возвращает профиль пользователя, идентифицированного по JWT.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users:
    get:
      tags: [Users]
      summary: Список пользователей (admin)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }

  /houses:
    post:
      tags: [Houses]
      summary: Создать дом
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HouseCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/House' }

  /houses/{houseId}:
    parameters: [ { $ref: '#/components/parameters/HouseId' } ]
    get:
      tags: [Houses]
      summary: Получить дом
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/House' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Houses]
      summary: Обновить дом
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HouseUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/House' }
    delete:
      tags: [Houses]
      summary: Удалить дом
      responses:
        '204': { description: Deleted }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    HouseId:
      name: houseId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 3600 }
    User:
      type: object
      required: [id, email, fullName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        phone: { type: string }
        role:
          type: string
          enum: [OWNER, FAMILY_MEMBER, GUEST, ADMIN]
        createdAt: { type: string, format: date-time }
    House:
      type: object
      required: [id, name, ownerId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        ownerId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    HouseCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        address: { type: string }
    HouseUpdate:
      type: object
      properties:
        name: { type: string }
        address: { type: string }