syntax = "proto3";

package warmhouse.device_management.v1;

option go_package = "github.com/DmitrakovPV/YP-Projects/warmhouse/gen/device_management/v1;devicemanagementv1";

import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";

service DeviceManagementService {
  // ---------- Публичные методы (есть REST-аналог на Gateway) ----------
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc GetDevice(GetDeviceRequest) returns (Device);
  rpc UpdateDevice(UpdateDeviceRequest) returns (Device);
  rpc DeleteDevice(DeleteDeviceRequest) returns (Empty);

  // ---------- Внутренние методы (REST-аналога нет) ----------

  // Вызывается heat/light/gate/surv — "Запрос текущего состояния".
  // См. контейнерную диаграмму: Rel(heat, dms, "Запрос текущего состояния", "gRPC")
  rpc GetDevicesByHouseAndType(GetDevicesByHouseAndTypeRequest)
      returns (GetDevicesByHouseAndTypeResponse);

  // Provisioning-флоу (таблица provisioning_sessions в ERD).
  // Публичного REST нет: устройство "заявляет" себя через MQTT,
  // dms проверяет claim_token_hash и переводит state в ACTIVE/ONLINE.
  rpc CreateProvisioningSession(CreateProvisioningSessionRequest)
      returns (ProvisioningSession);
  rpc ClaimDevice(ClaimDeviceRequest) returns (Device);

  // Опционально: точечный запрос состояния одного устройства.
  // Если GetDevicesByHouseAndType достаточно — можно убрать.
  rpc GetDeviceState(GetDeviceStateRequest) returns (DeviceStateSnapshot);
}

// ===================== Enums =====================

// Соответствует devices.state (VARCHAR в ERD).
// Значения — предмет сверки: в ERD enum не зафиксирован.
// Замените на реальные, если в коде используются другие.
enum DeviceState {
  DEVICE_STATE_UNSPECIFIED = 0;
  DEVICE_STATE_ONLINE = 1;
  DEVICE_STATE_OFFLINE = 2;
  DEVICE_STATE_UNKNOWN = 3;
}

// ===================== Основные сообщения =====================

message Device {
  string id = 1;                                   // devices.id
  string house_id = 2;
  warmhouse.common.v1.DeviceType type = 3;
  string name = 4;
  string serial = 5;                               // devices.serial (UQ)
  DeviceState state = 6;                           // devices.state
  google.protobuf.Timestamp last_seen_at = 7;
  google.protobuf.Timestamp created_at = 8;
}

message DeviceStateSnapshot {
  string device_id = 1;
  DeviceState state = 2;
  // Данные из report_state / desired_state (ERD).
  double current_temperature = 3;                  // report_state.temperature
  double target_temperature = 4;                   // desired_state.target_temperature
  google.protobuf.Timestamp updated_at = 5;
}

message ProvisioningSession {
  string session_id = 1;                           // provisioning_sessions.session_id
  string device_id = 2;                            // provisioning_sessions.device_id
  google.protobuf.Timestamp token_expires_at = 3;  // provisioning_sessions.token_expires_at
  // claim_token возвращается ОДИН раз при создании; в БД хранится только hash.
  string claim_token = 4;
}

// ===================== Requests / Responses =====================

message ListDevicesRequest {
  string house_id = 1;
  warmhouse.common.v1.DeviceType type_filter = 2;  // UNSPECIFIED = все
}

message ListDevicesResponse {
  repeated Device devices = 1;
}

message GetDeviceRequest {
  string device_id = 1;
}

message UpdateDeviceRequest {
  string device_id = 1;
  optional string name = 2;
}

message DeleteDeviceRequest {
  string device_id = 1;
}

message GetDevicesByHouseAndTypeRequest {
  string house_id = 1;
  warmhouse.common.v1.DeviceType type = 2;
}

message GetDevicesByHouseAndTypeResponse {
  repeated Device devices = 1;
}

message GetDeviceStateRequest {
  string device_id = 1;
}

message CreateProvisioningSessionRequest {
  string serial = 1;                               // devices.serial
  string house_id = 2;
  warmhouse.common.v1.DeviceType type = 3;
}

message ClaimDeviceRequest {
  string serial = 1;
  string claim_token = 2;
}

message Empty {}