syntax = "proto3";

package device.v1;

import "google/api/annotations.proto";

option go_package = "github.com/warmhouse/api/gen/device/v1;devicev1";

service DeviceService {
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse) {
    option (google.api.http) = { get: "/v1/devices" };
  }
  rpc CreateDevice(CreateDeviceRequest) returns (CreateDeviceResponse) {
    option (google.api.http) = {
      post: "/v1/devices"
      body: "*"
    };
  }
  rpc GetDevice(GetDeviceRequest) returns (GetDeviceResponse) {
    option (google.api.http) = { get: "/v1/devices/{device_id}" };
  }
  rpc UpdateDevice(UpdateDeviceRequest) returns (UpdateDeviceResponse) {
    option (google.api.http) = {
      patch: "/v1/devices/{device_id}"
      body: "*"
    };
  }
  rpc DeleteDevice(DeleteDeviceRequest) returns (DeleteDeviceResponse) {
    option (google.api.http) = { delete: "/v1/devices/{device_id}" };
  }
  rpc SetDesiredState(SetDesiredStateRequest) returns (SetDesiredStateResponse) {
    option (google.api.http) = {
      put: "/v1/devices/{device_id}/desired"
      body: "*"
    };
  }
}

enum DeviceState {
  DEVICE_STATE_UNSPECIFIED = 0;
  DEVICE_STATE_REGISTERED = 1;
  DEVICE_STATE_PROVISIONING = 2;
  DEVICE_STATE_ACTIVE = 3;
  DEVICE_STATE_OFFLINE = 4;
}

message Device {
  string id = 1;
  string serial = 2;
  string name = 3;
  DeviceState state = 4;
  ReportState reported = 5;
  DesiredState desired = 6;
}

message ReportState {
  double temperature = 1;
}

message DesiredState {
  double target_temperature = 1;
}

message ListDevicesRequest {
  string house_id = 1;
  DeviceState state = 2;
}

message ListDevicesResponse {
  repeated Device devices = 1;
}

message CreateDeviceRequest {
  string serial = 1;
  string house_id = 2;
}

message CreateDeviceResponse {
  Device device = 1;
}

message GetDeviceRequest {
  string device_id = 1;
}

message GetDeviceResponse {
  Device device = 1;
}

message UpdateDeviceRequest {
  string device_id = 1;
  optional string name = 2;
  DesiredState desired = 3;
}

message UpdateDeviceResponse {
  Device device = 1;
}

message DeleteDeviceRequest {
  string device_id = 1;
}

message DeleteDeviceResponse {}

message SetDesiredStateRequest {
  string device_id = 1;
  DesiredState desired = 2;
}

message SetDesiredStateResponse {
  DesiredState desired = 1;
}