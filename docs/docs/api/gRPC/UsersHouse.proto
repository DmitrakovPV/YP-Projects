syntax = "proto3";

package warmhouse.users_houses.v1;

option go_package = "github.com/DmitrakovPV/YP-Projects/warmhouse/gen/users_houses/v1;usershousesv1";

import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";

service UsersHousesService {
  // Auth
  rpc Login(LoginRequest) returns (TokenPair);
  rpc Refresh(RefreshRequest) returns (TokenPair);

  // Users
  rpc GetCurrentUser(GetCurrentUserRequest) returns (User);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // Houses
  rpc CreateHouse(CreateHouseRequest) returns (House);
  rpc GetHouse(GetHouseRequest) returns (House);
  rpc UpdateHouse(UpdateHouseRequest) returns (House);
  rpc DeleteHouse(DeleteHouseRequest) returns (Empty);

  // Внутренний вызов от notification-service — адресаты уведомлений.
  rpc GetNotificationRecipients(GetNotificationRecipientsRequest)
      returns (GetNotificationRecipientsResponse);
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message RefreshRequest {
  string refresh_token = 1;
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  int32 expires_in = 3;
}

message User {
  string id = 1;
  string email = 2;
  string full_name = 3;
  string phone = 4;
  warmhouse.common.v1.Role role = 5;
  google.protobuf.Timestamp created_at = 6;
}

message GetCurrentUserRequest {}

message ListUsersRequest {
  warmhouse.common.v1.PageRequest page = 1;
}

message ListUsersResponse {
  repeated User users = 1;
  warmhouse.common.v1.PageResponse page = 2;
}

message House {
  string id = 1;
  string name = 2;
  string address = 3;
  string owner_id = 4;
  google.protobuf.Timestamp created_at = 5;
}

message CreateHouseRequest {
  string name = 1;
  string address = 2;
  string owner_id = 3;
}

message GetHouseRequest {
  string house_id = 1;
}

message UpdateHouseRequest {
  string house_id = 1;
  optional string name = 2;
  optional string address = 3;
}

message DeleteHouseRequest {
  string house_id = 1;
}

message Empty {}

message GetNotificationRecipientsRequest {
  string house_id = 1;
  // Тип уведомления определяет, кому его отправлять.
  string notification_type = 2;
}

message GetNotificationRecipientsResponse {
  repeated Recipient recipients = 1;
}

message Recipient {
  string user_id = 1;
  string email = 2;
  string push_token = 3;
}