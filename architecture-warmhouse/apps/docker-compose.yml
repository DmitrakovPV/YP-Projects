version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: warmhome-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warmhome
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warmhome"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - warmhome-network

  temperature-api:
    build:
      context: ./temperature-api
      dockerfile: Dockerfile
    container_name: temperature-api
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - warmhome-network

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: warmhome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
    ports:
      - "8088:8080"
    restart: unless-stopped
    networks:
      - warmhome-network

volumes:
  postgres_data:

networks:
  warmhome-network:
    driver: bridge